# ─────────────────────────────────────────────────────────────
#  Lora (dépôt brief-matin) — configuration
#  Tout se règle ici. Le code ne contient aucune valeur en dur.
# ─────────────────────────────────────────────────────────────

podcast:
  # Le nom affiché dans les applis de podcast. Renommer ici ne casse rien ;
  # renommer le dépôt GitHub, si : l'adresse du flux changerait.
  title: "Lora"
  subtitle: "L'essentiel de l'actu, chaque matin"
  description: >
    Brief quotidien généré automatiquement à partir des grands titres
    français et internationaux. France, Monde, Économie, Tech.
  # Ajoutée à la description du podcast et à celle de chaque épisode :
  # quiconque tombe sur le flux sait d'emblée d'où viennent texte et voix.
  ai_disclosure: >-
    Brief généré automatiquement par intelligence artificielle, texte et
    voix, à partir de titres et chapôs de presse.
  # Auteur affiché et nom du propriétaire (<itunes:owner>). Pas de nom
  # d'artiste ni de nom réel : le podcast ne doit être associé à personne.
  author: "Lora"
  # ⚠ Adresse PUBLIQUE : elle est dans le flux, lisible par n'importe qui.
  # Spotify for Creators y envoie le code qui prouve la propriété du flux.
  # Jamais d'adresse personnelle ici.
  email: "lora.dailybrief@proton.me"
  language: "fr-FR"
  # Catégorie et sous-catégorie de la liste Apple, reprise par Spotify.
  # subcategory vide : pas de sous-catégorie.
  category: "News"
  subcategory: "Daily News"
  # ⚠️ À REMPLACER par l'URL de ta GitHub Page une fois le repo créé.
  # Format : https://<ton-pseudo-github>.github.io/<nom-du-repo>
  base_url: "https://iceman-ux.github.io/brief-matin"
  cover_image: "lora-cover.jpg"  # relatif à base_url, optionnel ; 3000 px de côté
  retention_days: 30           # mp3 de plus de 30 jours retirés du flux ET supprimés (docs/ et Release)

onboarding:
  # Lien iCloud du raccourci « Lora » (iPhone : Raccourcis → appui long sur
  # le raccourci → Partager → Copier le lien iCloud). Tant qu'il est vide, la
  # page d'installation affiche « bientôt disponible » au lieu d'un lien
  # mort. Version du 26/09/2026 : le raccourci ouvre d'abord le lien
  # d'abonnement Pocket Casts, puis lance la lecture. Le toucher une fois
  # suffit donc à s'abonner.
  shortcut_url: "https://www.icloud.com/shortcuts/d91403fd0a2f4b799bee35c193f49b6e"
  # Nom du raccourci tel qu'il apparaît chez le testeur après installation :
  # celui du raccourci partagé, pas celui du podcast. À changer avec
  # shortcut_url, si un raccourci renommé est repartagé.
  shortcut_name: "Lora"
  # Textes de l'affiche en tête de la page d'installation : surtitre au-dessus
  # du nom (brand.name), accroche en italique en dessous.
  kicker: "Le brief du matin"
  tagline: "l'essentiel du jour, avant l'aube"
  # Phrase sous la formule d'ouverture, suivie de listen_prompt quand un
  # épisode est publié (le lecteur apparaît alors), sinon de install_prompt.
  pitch: "3 minutes d'actu, lancées par ton réveil."
  listen_prompt: "Écoute celui d'aujourd'hui :"
  install_prompt: "Un geste pour l'installer."
  # Appli de podcast que le raccourci utilise, liée depuis l'étape 1 :
  # sans elle, le raccourci n'a rien à ouvrir. Fiche App Store de Pocket Casts.
  player_app_url: "https://apps.apple.com/app/id414834813"
  # Vidéo de la création de l'automatisation « réveil », montrée dans le
  # bonus au-dessus des gestes. Chemin relatif à base_url. Vide : pas de
  # vidéo, les gestes seuls.
  automation_video: ""
  # Page Spotify du podcast, une fois accepté. Vide : pas de bouton Spotify
  # dans « Autre appli ou Android ? ».
  spotify_url: ""

# Signatures de la marque. L'ouverture et la clôture sont des fichiers audio
# figés (assets/brand/, WAV 24 kHz mono, −17 LUFS, true peak ≤ −3 dBFS) :
# le TTS prononce mal « Lora » une fois sur deux, et un modèle de rédaction
# finit toujours par dévier d'une formule censée rester immuable. Le nom
# « Lora » ne passe donc jamais par le TTS. Le modèle n'écrit que
# l'accroche (et le clin d'œil d'un jour férié) ; le code les fait précéder
# de date_lead et de la date, dans une réplique dite par speaker.
brand:
  name: "Lora"
  # Fichiers, relatifs à la racine du dépôt. Un fichier absent n'arrête
  # jamais le run : l'épisode sort sans lui, avec un avertissement.
  # Ouverture : « Ici Lora, il est l'heure. » (prise I-marc-1, Marc).
  opening_file: "assets/brand/ouverture.wav"
  # Clôture selon le jour. Jours en anglais, comme dans
  # brief.lookback_hours ; default vaut pour tous les autres. default est
  # « C'était Lora. Belle journée. » (prise C1-marc) ; lundi et vendredi
  # sont montés à partir de son « C'était Lora. » (cloture-nom.wav).
  closing_files:
    default: "assets/brand/cloture.wav"
    monday: "assets/brand/cloture-lundi.wav"
    friday: "assets/brand/cloture-vendredi.wav"
  # Sonal composé par Adam, joué avant l'ouverture. Vide : pas de sonal.
  # Préparé par tools/preparer_sonal.py depuis assets/brand/sources/ :
  # −18,6 LUFS voulu (1,6 LU sous les signatures), true peak −3 dBFS, sans
  # limiteur ; le monter à −17 LUFS aurait exigé un limiteur. Tout format que
  # ffmpeg lit ; il est décodé puis encodé une seule fois avec le reste de
  # l'épisode. Manquant ou illisible : l'épisode sort sans, avec un ⚠⚠.
  sonal_file: "assets/brand/sonal.wav"
  # Chevauchement du sonal et de l'ouverture, en ms : la voix commence ce
  # temps avant la fin du sonal, sans baisser la musique. 0 : la voix suit
  # le sonal après gaps_ms.head (montage A). Montage B retenu par Adam le
  # 26/09 : 1010, la voix entre à 2,28 s sur 3,29, quand le sonal est
  # retombé 15 dB sous son maximum. S'il gêne la voix : 790 la fait entrer
  # à 2,5 s, 490 à 2,8 s.
  sonal_overlap_ms: 1010
  # Silences du montage, en ms, de voix à voix : les silences de tête et de
  # queue de chaque morceau sont coupés avant, pour que ces écarts soient
  # exacts. head : avant l'ouverture (après le sonal s'il y en a un).
  gaps_ms:
    head: 150
    after_opening: 350
    before_closing: 1000
  # Le texte parlé du brief commence par ces mots, la date en minuscules
  # (« Et aujourd'hui, jeudi 1er octobre. »), le clin d'œil éventuel, puis
  # l'accroche du modèle.
  date_lead: "Et aujourd'hui,"
  # L'accroche tient en ce nombre de mots au plus. Un écart donne un
  # avertissement, jamais un échec du run.
  hook_max_words: 20
  # Débuts d'accroche retirés (avec avertissement), la majuscule rétablie :
  # la réplique dit déjà « Et aujourd'hui, ».
  hook_strip_prefixes:
    - "Ce matin,"
    - "Aujourd'hui,"
  # Voix qui dit la réplique variable (nom d'un voices.speakers) : celle des
  # fichiers figés, pour que l'enchaînement s'entende d'une seule voix.
  speaker: "Marc"
  # Textes des signatures affichés sur la page d'installation. Jamais
  # envoyés au TTS : ils doivent seulement correspondre aux fichiers.
  opening_display: "Ici Lora, il est l'heure."
  closing_display: ["C'était Lora.", "Belle journée."]
  # Jours où le modèle écrit une phrase de clin d'œil après la date.
  # Fêtes à date fixe (MM-JJ). On peut y ajouter des dates symboliques.
  fixed_days:
    "01-01": "le jour de l'an"
    "05-01": "la fête du Travail"
    "05-08": "l'anniversaire de la victoire de 1945"
    "07-14": "la fête nationale"
    "08-15": "l'Assomption"
    "11-01": "la Toussaint"
    "11-11": "l'anniversaire de l'armistice de 1918"
    "12-25": "Noël"
  # Fêtes mobiles, en jours après le dimanche de Pâques (calculé).
  easter_offsets:
    0: "le dimanche de Pâques"
    1: "le lundi de Pâques"
    39: "le jeudi de l'Ascension"
    50: "le lundi de Pentecôte"
  # Débuts de phrase retirés du script si le modèle écrit quand même une
  # salutation (en tête de la première réplique) ou une clôture (en fin de
  # la dernière). Comparaison sans casse, phrase par phrase.
  strip_opening:
    - "Bonjour"
    - "Bonsoir"
    - "Salut"
    - "Bienvenue"
    - "Nous sommes le"
    - "On est le"
    - "Lora"
    - "Ici Lora"
    - "Il est l'heure"
    - "Et aujourd'hui"
  strip_closing:
    - "C'est tout pour"
    - "C'était"
    - "Belle journée"
    - "Bonne journée"
    - "Belle semaine"
    - "Bonne semaine"
    - "Bon week-end"
    - "À demain"
    - "Merci"

brief:
  target_minutes: 4           # durée visée (pilote le coût TTS)
  words_per_minute: 190        # mesuré sur les voix Gemini, pas une moyenne
                               # théorique : 426 mots ont donné 2 min 13.
  timezone: "Europe/Paris"

  # Fenêtre d'actu récupérée, en heures, selon le jour de la semaine.
  # 0 = lundi ... 6 = dimanche. Le lundi on ratisse le week-end.
  lookback_hours:
    default: 26
    monday: 74
  # Le vendredi, on ajoute une section "à retenir de la semaine".
  weekly_recap_on: ["friday"]

  # Nombre de sujets traités dans le brief.
  topics_min: 5
  topics_max: 8

  # Seuil de regroupement des articles qui parlent du même sujet (0 → 1).
  # Plus bas = fusionne plus agressivement. 0.6 est un bon compromis.
  dedupe_threshold: 0.6

  # Articles envoyés au rédacteur, les mieux classés d'abord (poids et
  # reprises). Ce sont aussi les sources gardées pour le garde-fou de
  # fidélité. Chaque article ajouté rallonge le prompt, donc la facture.
  prompt_articles: 120

  # Répartition éditoriale visée (indicative, transmise au rédacteur).
  mix:
    france: 3
    monde: 3
    eco: 1
    tech: 1

voices:
  two_voices: true
  speakers:
    - name: "Léa"
      voice: "Kore"        # ferme, posée — voix de fil conducteur
      role: "présentatrice qui déroule le fil et pose le contexte"
    - name: "Marc"
      voice: "Puck"        # énergique — relances et angles
      role: "chroniqueur qui relance, nuance et apporte l'angle"
  direction: >
    Lecture de studio, rythme soutenu mais jamais précipité. Ton de matinale
    radio : éveillé, clair, jamais solennel. Marquer une vraie respiration
    entre chaque sujet. Léa pose, Marc relance avec une once de relief.

  # Voix sur mesure Gemini (Voice design) — NON UTILISÉES EN PRODUCTION.
  # Essayées au tour 2 du test à l'aveugle et écartées le 24/09 ; gardées
  # pour « say --voice-set designed ». Elles n'existent
  # que pour les modèles gemini-3.8-* et expirent un an après leur création
  # (24/09/2026). Ce ne sont pas des secrets : un identifiant ne sert qu'avec
  # une clé du projet Google. Descriptions en deux phrases de traits
  # permanents, comme le recommande la doc : les réactions à l'info passent
  # par les intentions de chaque réplique, pas par la voix.
  designed:
    - name: "Léa"
      voice: "voice_kaoy0206y000"
      description: >-
        Animatrice de matinale radio française, la trentaine, accent standard
        de France. Voix chaleureuse, lumineuse et énergique, sourire audible,
        débit vivant, parle comme à un ami qu'elle réveille, jamais comme une
        speakerine.
    - name: "Marc"
      voice: "voice_y8pe771eq6ho"
      description: >-
        Journaliste de matinale radio française, la quarantaine, accent
        standard de France. Voix chaude et posée mais tonique, rythme
        conversationnel avec de petites relances naturelles, curieux, un peu
        pince-sans-rire.

# ElevenLabs — NON UTILISÉ EN PRODUCTION. Essayé au tour 2 du test à
# l'aveugle et écarté le 24/09 : moins bon à l'oreille, et environ 22 $/mois
# contre 1 à 2 $ avec Gemini. Gardé pour « say --tts-provider elevenlabs ».
elevenlabs:
  api_url: "https://api.elevenlabs.io/v1/text-to-dialogue"
  # Text to Dialogue n'existe qu'avec Eleven v3.
  model_id: "eleven_v3"
  language_code: "fr"
  # La doc garantit 2 000 caractères par requête ; au-delà, l'audio peut
  # s'arrêter en route. Marge pour les balises d'intention ajoutées.
  max_chars_per_request: 1900
  # Même graine pour toutes les requêtes d'un brief : chaque requête
  # réinterprète les voix, la graine limite l'écart d'une requête à l'autre.
  seed: 20260923
  # PCM 24 kHz 16 bits mono, le format des modèles Gemini : les morceaux se
  # recollent et s'encodent par le même chemin, sans décodage mp3.
  output_format: "pcm_24000"
  timeout_s: 180
  # Voix de la bibliothèque ElevenLabs, par nom de locuteur : natives
  # fr-FR. Pas de clone « professional » : la doc les dit mal optimisés
  # pour Eleven v3. Celles du Z du tour 2, choisies à l'oreille sur le site ;
  # Nicolas Petit (AmMsHJaCw4BtwV3KoUXF) a été écouté puis écarté pour Marc.
  speakers:
    - name: "Léa"
      voice: "O31r762Gb3WFygrEOGh0"   # Victoire
    - name: "Marc"
      voice: "gP52hjM48hyNoVCbizxO"   # Alexandre - Calm, Warm & Authentic

models:
  # Rédaction du script. Modèle texte, peu coûteux.
  writer: "gemini-3.8-flash"
  # Modèles de repli, essayés dans l'ordre quand le précédent reste
  # indisponible après tous ses réessais. Chaque modèle ajouté rallonge
  # d'autant un run qui échoue. Liste vide pour désactiver la bascule.
  writer_fallbacks:
    - "gemini-3.5-flash"
  # Réflexion du rédacteur et de ses replis avant d'écrire : minimal, low,
  # medium ou high (paramètre thinking_level de la famille Gemini 3). Vide :
  # le défaut du modèle, qui réfléchissait 21 326 tokens pour 1 757 écrits
  # le 25/09. La réflexion est facturée comme de la sortie. Un modèle qui
  # refuse le paramètre est rappelé sans lui, avec un avertissement.
  # Laissé vide après essai le 25/09 : low et medium coûtent 5 et 2 fois
  # moins, mais enfreignent les règles de dialogue du prompt (alternance
  # mécanique, aucun sujet en solo). Scripts dans tests/reflexion/.
  writer_thinking: ""
  # Tarif de la rédaction en $ par million de tokens ; output compte aussi
  # la réflexion. Relevé par Cowork le 2026-09-25, à revérifier. Un modèle
  # absent de la grille affiche « coût inconnu ».
  writer_prices:
    "gemini-3.8-flash": {input: 0.75, output: 3.75}
  # Synthèse vocale. Facturé au token audio (25 tokens / seconde).
  # Gagnant des deux tours du test à l'aveugle du 24/09, avec les voix
  # Kore/Puck, en un seul appel et avec la finition : contre
  # 3.1-flash-tts-preview et 3.8-flash-lite-tts au tour 1, contre les voix
  # sur mesure et ElevenLabs au tour 2. Les modèles 3.8 lisent le texte
  # mot pour mot : voices.direction ne leur est pas envoyée.
  tts: "gemini-3.8-flash-tts"
  # ⚠ NON IMPLÉMENTÉ. Le mode batch serait deux fois moins cher, mais la
  # synthèse appelle generate_content en synchrone. Le flag ne change rien
  # au comportement ni au coût réel ; il émet un avertissement s'il est
  # activé. Voir TODO.md.
  tts_batch: false

memory:
  # Le rédacteur reçoit la liste des sujets déjà traités sur cette fenêtre
  # et a pour consigne de ne pas les rejouer, sauf vrai rebondissement.
  lookback_days: 7
  path: "data/covered.json"

# Garde-fou de fidélité aux sources, entre la rédaction et la synthèse. Il
# ne bloque JAMAIS l'épisode : une panne, une API saturée ou une réponse
# illisible laissent sortir le script tel quel, avec un avertissement ⚠⚠.
# Trace de chaque épisode dans reports_dir.
fidelite:
  enabled: true
  # Reprise : une suite d'au moins ce nombre de mots consécutifs du script
  # présente telle quelle dans un titre ou un chapô du jour (sans casse,
  # accents ni ponctuation). Droit voisin de la presse : le script ne
  # recopie pas les articles. Contrôle local, sans appel API.
  copy_min_words: 8
  # Un passage entre « » de ce nombre de mots au plus est une citation de
  # personne : compté à part, jamais signalé comme reprise. Au-delà, il est
  # contrôlé comme le reste du texte.
  quote_max_words: 20
  # Contrôle des faits : un appel au modèle de rédaction (models.writer,
  # sans repli) cherche chiffres, noms, dates et citations absents des
  # sources. ~0,01 à 0,02 $ par épisode.
  check_facts: true
  # Réflexion de ce contrôle (thinking_level) : il compare, il n'écrit pas.
  thinking: "low"
  # Types d'affirmation non sourcée jugés graves : eux seuls, avec les
  # reprises, déclenchent une correction. Les autres (« autre »,
  # « contexte ») restent dans la trace.
  high_severity_types: ["chiffre", "nom", "date", "citation"]
  # Correction : un appel au plus par épisode, qui réécrit seulement les
  # répliques en cause. Suivie du seul contrôle de reprise, sans nouvel
  # appel. Si elle échoue, le script d'origine est gardé.
  fix: true
  fix_thinking: "low"
  # Tentatives par appel sur erreur 429/5xx. Bas : un contrôle qui attend
  # une minute de plus retarde tout le run, et il peut sauter sans dommage.
  retry_attempts: 2
  # Sources envoyées au rédacteur, gardées pour pouvoir rejouer le contrôle
  # (commande « fidelite »). Même rétention que les épisodes
  # (podcast.retention_days). Versionnées avec les scripts.
  sources_dir: "data/sources"
  reports_dir: "data/fidelite"

audio:
  # Débit du mp3 publié, en mono. Spotify recommande 96 à 320 kbps : 96k
  # est le plancher, ~2,5 Mo pour 3 min 30.
  bitrate: "96k"
  sample_rate: 24000 # imposé par le modèle TTS (PCM 24 kHz 16 bits mono)
  # Fréquence du mp3 publié seulement : tout le traitement (finition,
  # montage) reste à sample_rate, et le rééchantillonnage se fait une fois,
  # à l'encodage. 44,1 kHz, la fréquence attendue par les plateformes ; la
  # voix ne gagne rien au-delà de 12 kHz, mais aucune ne s'en plaint.
  output_sample_rate: 44100
  # Au-delà, le script est découpé en plusieurs appels TTS puis recollé.
  # Chaque appel réinterprète les voix : à 150 mots par morceau, le test à
  # l'aveugle entendait les voix changer en cours de brief. 900 mots tient
  # un brief entier en un seul appel, et c'est ce qui a supprimé les
  # changements de voix : ne pas baisser. Un brief plus long serait découpé.
  max_words_per_chunk: 900
  # Silence inséré entre deux morceaux recollés. Chaque appel TTS rend un
  # audio bordé de silence : on le rabote, puis on impose cet écart-là, qui
  # correspond à une respiration normale entre deux sujets.
  chunk_gap_ms: 320
  # Écart entre la voix et le bord pour couper les silences de tête et de
  # queue avant le montage : seuil (dBFS, sur des fenêtres de 10 ms) et marge
  # gardée autour de la voix pour ne pas rogner une attaque ou une chute.
  trim_threshold_db: -40
  trim_margin_ms: 20
  # Où vivent les mp3 publiés.
  # releases : attachés à une Release GitHub, hors de l'historique Git (qui
  #   grossirait de ~0,9 Go par an), et GitHub compte les téléchargements
  #   (commande « stats »). Si l'envoi échoue, l'épisode part quand même
  #   dans docs/episodes/, avec un avertissement.
  # pages : commités dans docs/episodes/ et servis par GitHub Pages.
  storage: releases
  # Dépôt et tag de la Release unique qui porte tous les épisodes, créée au
  # premier envoi. Changer l'un ou l'autre casse l'URL des épisodes publiés.
  release_repo: "iceman-ux/brief-matin"
  release_tag: "episodes"
  # Au-delà, un appel à la CLI gh est abandonné : l'envoi bascule alors sur
  # docs/episodes/ plutôt que de bloquer le run.
  release_timeout_seconds: 180

# Finition audio : compression légère puis normalisation, avant le montage
# et l'unique encodage mp3 (débit et fréquence d'audio ci-dessus). Appliquée à chaque brief (run,
# say, dry-run) et par la commande « finish ». Retenue avec la voix gagnante
# du test à l'aveugle du 24/09, qu'elle rend « plus pro ».
finishing:
  # false : le brief est encodé en mp3 tel que le TTS le rend, sans finition.
  # Si elle est activée et échoue, le run échoue et ne publie rien.
  enabled: true
  compressor:
    # Ne touche que les pics de voix : la parole normale reste sous le seuil.
    threshold_db: -20
    # 2:1, compression douce : resserre l'écart entre les deux voix sans
    # écraser les intonations.
    ratio: 2
    attack_ms: 20
    release_ms: 250
  loudness:
    # −16 LUFS : la référence des podcasts, celle d'Apple.
    integrated_lufs: -16
    # Marge sous 0 dBFS pour l'encodage mp3, qui fait déborder les crêtes :
    # de 1,5 à 2,6 dB à 40 kbps (mesuré le 24/09, d'où ce −3). À 96 kbps et
    # 44,1 kHz, 0,4 dB seulement : −2,6 dBTP mesuré le 26/09 sur un brief
    # complet avec ses signatures. On garde −3, qui laisse de la marge.
    true_peak_db: -3
    # Plage de loudness tolérée, en LU. 11 laisse respirer la parole.
    range_lu: 11

# ─────────────────────────────────────────────────────────────
