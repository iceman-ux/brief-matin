# ─────────────────────────────────────────────────────────────
#  Brief Matin — configuration
#  Tout se règle ici. Le code ne contient aucune valeur en dur.
# ─────────────────────────────────────────────────────────────

podcast:
  title: "Brief Matin"
  subtitle: "Le récap perso de l'actu, tous les matins"
  description: >
    Brief quotidien généré automatiquement à partir des grands titres
    français et internationaux. France, Monde, Économie, Tech.
  # Ajoutée à la description du podcast et à celle de chaque épisode :
  # quiconque tombe sur le flux sait d'emblée d'où viennent texte et voix.
  ai_disclosure: >-
    Brief généré automatiquement par intelligence artificielle, texte et
    voix, à partir de titres et chapôs de presse.
  author: "neodem"
  email: "annihilateurdedaronne@gmail.com"
  language: "fr-FR"
  category: "News"
  # ⚠️ À REMPLACER par l'URL de ta GitHub Page une fois le repo créé.
  # Format : https://<ton-pseudo-github>.github.io/<nom-du-repo>
  base_url: "https://iceman-ux.github.io/brief-matin"
  cover_image: "cover.png"     # relatif à base_url, optionnel
  retention_days: 30           # on garde les 30 derniers épisodes

onboarding:
  # Lien iCloud du raccourci « Brief Matin » (iPhone : Raccourcis → appui
  # long sur le raccourci → Partager → Copier le lien iCloud). Tant qu'il est
  # vide, la page d'installation affiche « bientôt disponible » à l'étape 2
  # au lieu d'un lien mort.
  shortcut_url: ""

brief:
  target_minutes: 4           # durée visée (pilote le coût TTS)
  words_per_minute: 190        # mesuré sur les voix Gemini, pas une moyenne
                               # théorique : 426 mots ont donné 2 min 13.
  timezone: "Europe/Paris"

  # Fenêtre d'actu récupérée, en heures, selon le jour de la semaine.
  # 0 = lundi ... 6 = dimanche. Le lundi on ratisse le week-end.
  lookback_hours:
    default: 26
    monday: 74
  # Le vendredi, on ajoute une section "à retenir de la semaine".
  weekly_recap_on: ["friday"]

  # Nombre de sujets traités dans le brief.
  topics_min: 5
  topics_max: 8

  # Seuil de regroupement des articles qui parlent du même sujet (0 → 1).
  # Plus bas = fusionne plus agressivement. 0.6 est un bon compromis.
  dedupe_threshold: 0.6

  # Répartition éditoriale visée (indicative, transmise au rédacteur).
  mix:
    france: 3
    monde: 3
    eco: 1
    tech: 1

voices:
  two_voices: true
  speakers:
    - name: "Léa"
      voice: "Kore"        # ferme, posée — voix de fil conducteur
      role: "présentatrice qui déroule le fil et pose le contexte"
    - name: "Marc"
      voice: "Puck"        # énergique — relances et angles
      role: "chroniqueur qui relance, nuance et apporte l'angle"
  direction: >
    Lecture de studio, rythme soutenu mais jamais précipité. Ton de matinale
    radio : éveillé, clair, jamais solennel. Marquer une vraie respiration
    entre chaque sujet. Léa pose, Marc relance avec une once de relief.

  # Voix sur mesure Gemini (Voice design) — NON UTILISÉES EN PRODUCTION.
  # Essayées au tour 2 du test à l'aveugle et écartées le 24/09 ; gardées
  # pour « say --voice-set designed ». Elles n'existent
  # que pour les modèles gemini-3.8-* et expirent un an après leur création
  # (24/09/2026). Ce ne sont pas des secrets : un identifiant ne sert qu'avec
  # une clé du projet Google. Descriptions en deux phrases de traits
  # permanents, comme le recommande la doc : les réactions à l'info passent
  # par les intentions de chaque réplique, pas par la voix.
  designed:
    - name: "Léa"
      voice: "voice_kaoy0206y000"
      description: >-
        Animatrice de matinale radio française, la trentaine, accent standard
        de France. Voix chaleureuse, lumineuse et énergique, sourire audible,
        débit vivant, parle comme à un ami qu'elle réveille, jamais comme une
        speakerine.
    - name: "Marc"
      voice: "voice_y8pe771eq6ho"
      description: >-
        Journaliste de matinale radio française, la quarantaine, accent
        standard de France. Voix chaude et posée mais tonique, rythme
        conversationnel avec de petites relances naturelles, curieux, un peu
        pince-sans-rire.

# ElevenLabs — NON UTILISÉ EN PRODUCTION. Essayé au tour 2 du test à
# l'aveugle et écarté le 24/09 : moins bon à l'oreille, et environ 22 $/mois
# contre 1 à 2 $ avec Gemini. Gardé pour « say --tts-provider elevenlabs ».
elevenlabs:
  api_url: "https://api.elevenlabs.io/v1/text-to-dialogue"
  # Text to Dialogue n'existe qu'avec Eleven v3.
  model_id: "eleven_v3"
  language_code: "fr"
  # La doc garantit 2 000 caractères par requête ; au-delà, l'audio peut
  # s'arrêter en route. Marge pour les balises d'intention ajoutées.
  max_chars_per_request: 1900
  # Même graine pour toutes les requêtes d'un brief : chaque requête
  # réinterprète les voix, la graine limite l'écart d'une requête à l'autre.
  seed: 20260923
  # PCM 24 kHz 16 bits mono, le format des modèles Gemini : les morceaux se
  # recollent et s'encodent par le même chemin, sans décodage mp3.
  output_format: "pcm_24000"
  timeout_s: 180
  # Voix de la bibliothèque ElevenLabs, par nom de locuteur : natives
  # fr-FR. Pas de clone « professional » : la doc les dit mal optimisés
  # pour Eleven v3. Celles du Z du tour 2, choisies à l'oreille sur le site ;
  # Nicolas Petit (AmMsHJaCw4BtwV3KoUXF) a été écouté puis écarté pour Marc.
  speakers:
    - name: "Léa"
      voice: "O31r762Gb3WFygrEOGh0"   # Victoire
    - name: "Marc"
      voice: "gP52hjM48hyNoVCbizxO"   # Alexandre - Calm, Warm & Authentic

models:
  # Rédaction du script. Modèle texte, peu coûteux.
  writer: "gemini-3.8-flash"
  # Modèles de repli, essayés dans l'ordre quand le précédent reste
  # indisponible après tous ses réessais. Chaque modèle ajouté rallonge
  # d'autant un run qui échoue. Liste vide pour désactiver la bascule.
  writer_fallbacks:
    - "gemini-3.5-flash"
  # Synthèse vocale. Facturé au token audio (25 tokens / seconde).
  # Gagnant des deux tours du test à l'aveugle du 24/09, avec les voix
  # Kore/Puck, en un seul appel et avec la finition : contre
  # 3.1-flash-tts-preview et 3.8-flash-lite-tts au tour 1, contre les voix
  # sur mesure et ElevenLabs au tour 2. Les modèles 3.8 lisent le texte
  # mot pour mot : voices.direction ne leur est pas envoyée.
  tts: "gemini-3.8-flash-tts"
  # ⚠ NON IMPLÉMENTÉ. Le mode batch serait deux fois moins cher, mais la
  # synthèse appelle generate_content en synchrone. Le flag ne change rien
  # au comportement ni au coût réel ; il émet un avertissement s'il est
  # activé. Voir TODO.md.
  tts_batch: false

memory:
  # Le rédacteur reçoit la liste des sujets déjà traités sur cette fenêtre
  # et a pour consigne de ne pas les rejouer, sauf vrai rebondissement.
  lookback_days: 7
  path: "data/covered.json"

audio:
  bitrate: "40k"     # mono parlé à 24 kHz : 40 kbps reste transparent (~1,2 Mo / 4 min)
  sample_rate: 24000 # imposé par le modèle TTS (PCM 24 kHz 16 bits mono)
  # Au-delà, le script est découpé en plusieurs appels TTS puis recollé.
  # Chaque appel réinterprète les voix : à 150 mots par morceau, le test à
  # l'aveugle entendait les voix changer en cours de brief. 900 mots tient
  # un brief entier en un seul appel, et c'est ce qui a supprimé les
  # changements de voix : ne pas baisser. Un brief plus long serait découpé.
  max_words_per_chunk: 900
  # Silence inséré entre deux morceaux recollés. Chaque appel TTS rend un
  # audio bordé de silence : on le rabote, puis on impose cet écart-là, qui
  # correspond à une respiration normale entre deux sujets.
  chunk_gap_ms: 320
  # Jingle optionnel collé en tête (mets un mp3 dans assets/ et donne le nom)
  intro_file: null
  outro_file: null

# Finition audio : compression légère puis normalisation, réencodage au
# débit et à la fréquence d'audio ci-dessus. Appliquée à chaque brief (run,
# say, dry-run) et par la commande « finish ». Retenue avec la voix gagnante
# du test à l'aveugle du 24/09, qu'elle rend « plus pro ».
finishing:
  # false : le brief est encodé en mp3 tel que le TTS le rend, sans finition.
  # Si elle est activée et échoue, le run échoue et ne publie rien.
  enabled: true
  compressor:
    # Ne touche que les pics de voix : la parole normale reste sous le seuil.
    threshold_db: -20
    # 2:1, compression douce : resserre l'écart entre les deux voix sans
    # écraser les intonations.
    ratio: 2
    attack_ms: 20
    release_ms: 250
  loudness:
    # −16 LUFS : la référence des podcasts, celle d'Apple.
    integrated_lufs: -16
    # Marge sous 0 dBFS : l'encodage mp3 fait déborder les crêtes.
    true_peak_db: -1.5
    # Plage de loudness tolérée, en LU. 11 laisse respirer la parole.
    range_lu: 11

