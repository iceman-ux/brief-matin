name: Brief quotidien

on:
  # Déclencheur principal : cron-job.org appelle l'API workflow_dispatch à
  # 4 h 00 et 4 h 20 heure de Paris (guide dans « Claude outputs/ »). Un
  # dispatch part en quelques secondes ; les crons GitHub ci-dessous partent
  # avec 5 à 7 h de retard et ne servent plus que de secours.
  schedule:
    # Trois créneaux de nuit : 4 h 30, 5 h 30 et 6 h 30 heure de Paris en été.
    # GitHub abandonne régulièrement les runs planifiés (problème ouvert
    # depuis août 2026), d'où la redondance. La garde d'idempotence dans
    # cmd_run empêche les créneaux suivants de regénérer un brief déjà publié.
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    # Filet de sécurité après la remise à zéro du quota gratuit Gemini (minuit
    # heure du Pacifique = 7 h UTC l'été, 8 h UTC l'hiver) ; la garde
    # d'idempotence l'arrête si le brief est déjà publié.
    - cron: "10 8 * * *"
  workflow_dispatch:      # bouton "Run workflow" pour tester à la demande
    inputs:
      dry_run:
        description: "Dry-run : aucun appel API payant, rien n'est publié"
        type: boolean
        default: false

permissions:
  contents: write         # committer l'épisode et la mémoire, attacher le mp3 à la Release
  issues: write           # ouvrir l'alerte « échec du run »

# Un seul run à la fois, sans annuler celui qui tourne : le suivant attend,
# puis la garde d'idempotence l'arrête si l'épisode est sorti entre-temps.
concurrency:
  group: brief-matin
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Un créneau mis en file derrière un autre part du commit figé à son
      # déclenchement : sans ce pull, la garde ne voit pas l'épisode publié.
      - name: Rattraper le dernier état de main
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # L'image Ubuntu n'a pas ffmpeg, et apt-get est resté bloqué jusqu'au
      # timeout du job les 30/09 et 01/10. D'où un essai apt borné, puis une
      # archive statique figée dont l'empreinte est vérifiée.
      - name: Installer ffmpeg
        timeout-minutes: 6
        env:
          FFMPEG_STATIC_URL: https://www.johnvansickle.com/ffmpeg/old-releases/ffmpeg-6.0.1-amd64-static.tar.xz
          FFMPEG_STATIC_SHA256: 28268bf402f1083833ea269331587f60a242848880073be8016501d864bd07a5
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg déjà présent."
          elif timeout 60 sudo apt-get update -qq                && timeout 120 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then
            echo "ffmpeg installé par apt."
          else
            echo "::warning::apt n'a pas installé ffmpeg, repli sur l'archive statique."
            curl -fsSL --max-time 120 --retry 2 -o /tmp/ffmpeg.tar.xz "$FFMPEG_STATIC_URL"
            echo "$FFMPEG_STATIC_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf /tmp/ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          fi

      - name: Installer les dépendances
        run: pip install -q -r requirements.txt

      # Le drapeau passe par une variable d'environnement plutôt que par une
      # expression dans la ligne de commande : plus lisible, et ça évite les
      # pièges de conversion booléen/chaîne des entrées de workflow_dispatch.
      - name: Générer le brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Lu par la CLI gh pour attacher le mp3 à la Release ; GitHub le
          # masque dans les logs, et le code ne l'affiche jamais.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.main run --dry-run
          else
            python -m src.main run
          fi

      - name: Publier
        run: |
          git config user.name  "brief-matin[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sources du jour et trace du garde-fou de fidélité : de quoi
          # rejouer le contrôle d'un épisode après coup (commande fidelite).
          git add docs/ data/covered.json data/scripts/ data/sources/ data/fidelite/
          # docs/episodes/*.mp3 est ignoré : il n'y reste un mp3 que si
          # l'envoi à la Release a échoué, et ce repli doit être publié.
          git add -f docs/episodes/
          if git diff --staged --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "brief du $(TZ=Europe/Paris date +%F)"
            # Le run peut entrer en collision avec un push manuel : on rebase.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Résumé lisible dans l'onglet Actions. jq est préinstallé sur les
      # runners Ubuntu : plus de script Python inline, donc plus de guillemets
      # imbriqués — c'est ce qui avait cassé l'analyse du fichier.
      - name: Résumé
        if: always()
        run: |
          echo "### Brief du $(TZ=Europe/Paris date +%F)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/episodes.json ]; then
            jq -r '.[0].title' docs/episodes.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[0].topics[]?.title | "- " + .' docs/episodes.json >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # Un e-mail de GitHub à chaque issue ouverte : l'alerte arrive avant le
      # réveil. cancelled() couvre le dépassement du timeout du job, qui
      # avait annulé les runs bloqués sur ffmpeg. Une seule issue ouverte
      # par jour, même si les deux déclenchements de la nuit échouent.
      - name: Alerter par une issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          day=$(TZ=Europe/Paris date +%F)
          title="Lora : échec du run du $day"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Issue déjà ouverte : $title"
          else
            gh issue create --title "$title" --body "Le run $RUN_URL a échoué ou a été interrompu. Aucun épisode n'a été publié par ce run ; vérifier si un autre déclenchement l'a rattrapé."
          fi
