name: Brief quotidien

on:
  schedule:
    # Trois créneaux de nuit : 4 h 30, 5 h 30 et 6 h 30 heure de Paris en été.
    # GitHub abandonne régulièrement les runs planifiés (problème ouvert
    # depuis août 2026), d'où la redondance. La garde d'idempotence dans
    # cmd_run empêche les créneaux suivants de regénérer un brief déjà publié.
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    # Filet de sécurité après la remise à zéro du quota gratuit Gemini (minuit
    # heure du Pacifique = 7 h UTC l'été, 8 h UTC l'hiver) ; la garde
    # d'idempotence l'arrête si le brief est déjà publié.
    - cron: "10 8 * * *"
  workflow_dispatch:      # bouton "Run workflow" pour tester à la demande
    inputs:
      dry_run:
        description: "Dry-run : aucun appel API payant, rien n'est publié"
        type: boolean
        default: false

permissions:
  contents: write         # committer l'épisode et la mémoire, attacher le mp3 à la Release

concurrency:
  group: brief-matin
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Un créneau mis en file derrière un autre part du commit figé à son
      # déclenchement : sans ce pull, la garde ne voit pas l'épisode publié.
      - name: Rattraper le dernier état de main
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Installer les dépendances
        run: pip install -q -r requirements.txt

      # Le drapeau passe par une variable d'environnement plutôt que par une
      # expression dans la ligne de commande : plus lisible, et ça évite les
      # pièges de conversion booléen/chaîne des entrées de workflow_dispatch.
      - name: Générer le brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Lu par la CLI gh pour attacher le mp3 à la Release ; GitHub le
          # masque dans les logs, et le code ne l'affiche jamais.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.main run --dry-run
          else
            python -m src.main run
          fi

      - name: Publier
        run: |
          git config user.name  "brief-matin[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/covered.json data/scripts/
          # docs/episodes/*.mp3 est ignoré : il n'y reste un mp3 que si
          # l'envoi à la Release a échoué, et ce repli doit être publié.
          git add -f docs/episodes/
          if git diff --staged --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "brief du $(date -u +%F)"
            # Le run peut entrer en collision avec un push manuel : on rebase.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Résumé lisible dans l'onglet Actions. jq est préinstallé sur les
      # runners Ubuntu : plus de script Python inline, donc plus de guillemets
      # imbriqués — c'est ce qui avait cassé l'analyse du fichier.
      - name: Résumé
        if: always()
        run: |
          echo "### Brief du $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/episodes.json ]; then
            jq -r '.[0].title' docs/episodes.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[0].topics[]?.title | "- " + .' docs/episodes.json >> "$GITHUB_STEP_SUMMARY" || true
          fi
